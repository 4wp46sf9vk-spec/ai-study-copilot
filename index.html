<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102b78"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Study Copilot"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><title>AI Study Copilot</title>
<style>
:root{--blue:#2468f2;--ink:#14234c;--bg:#eef4ff}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;background:linear-gradient(160deg,#071633,#17378b 55%,#9dbdff);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom))}.app{max-width:650px;margin:auto}.top{display:flex;align-items:center;gap:12px;margin:9px 0 20px}.logo{width:54px;height:54px;border-radius:17px;background:linear-gradient(135deg,#5de0ff,#786aff);display:grid;place-items:center;font-size:30px;box-shadow:0 8px 20px #00104d66}.top h1{font-size:22px;margin:0}.top p{font-size:13px;color:#d7e6ff;margin:4px 0}.card{background:#f9fbff;color:var(--ink);border-radius:22px;padding:16px;margin:12px 0;box-shadow:0 8px 24px #020b3b45}.title{font-weight:800;color:#1658c7;margin-bottom:12px}.tabs{display:flex;gap:8px;margin:14px 0}.tab{flex:1;background:#ffffff20;border:1px solid #ffffff45;color:white}.tab.active{background:white;color:#1747a7}input,textarea{width:100%;font:inherit;padding:12px;border:1px solid #c6d7f4;border-radius:13px;background:white;color:#14234c}textarea{min-height:115px;margin-top:9px}button{font:inherit;font-weight:700;border:0;border-radius:13px;padding:13px 15px;background:var(--blue);color:white;cursor:pointer}.secondary{background:#e8f0ff;color:#1749a6;border:1px solid #c1d5ff}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.row button{flex:1}.preview{max-width:100%;max-height:270px;display:none;margin:10px auto;border-radius:12px}.muted{font-size:12px;line-height:1.55;color:#69799b}.answer{background:#dcfce7;color:#14532d;border:1px solid #86efac;border-radius:12px;padding:12px;font-weight:800}.hidden{display:none!important}.item{padding:10px 0;border-bottom:1px solid #e3eafa}.footer{text-align:center;color:#dbe8ff;font-size:12px;margin-top:18px}
</style></head><body><main class="app">
<header class="top"><div class="logo">🤖</div><div><h1>AI Study Copilot</h1><p>iPhone PWA · v1.0</p></div></header>
<div class="tabs"><button class="tab active" data-page="study">解題</button><button class="tab" data-page="mistakes">錯題本</button><button class="tab" data-page="settings">設定</button></div>
<section id="study">
<div class="card"><div class="title">📷 匯入練習題</div><input id="file" type="file" accept="image/*"><img id="preview" class="preview"><p class="muted">可選取相簿中的題目截圖。iOS Safari 不允許網頁在背景直接擷取其他 App 螢幕。</p><textarea id="question" placeholder="貼上題目文字與選項…"></textarea><div class="row"><button class="secondary" id="demo">示範題</button><button id="analyze">解析題目</button></div></div>
<div class="card hidden" id="result"><div class="title">✨ 解題解析</div><div id="answer" class="answer"></div><h3>思路</h3><p id="reason"></p><h3>知識重點</h3><p id="knowledge"></p><div class="row"><button class="secondary" id="save">存入錯題本</button></div></div>
</section>
<section id="mistakes" class="hidden"><div class="card"><div class="title">📚 錯題本</div><div id="list"><p class="muted">尚未保存題目。</p></div><button class="secondary" id="clearMistakes">清空錯題本</button></div></section>
<section id="settings" class="hidden"><div class="card"><div class="title">⚙️ 設定與 AI 連線</div><p>這是可安裝的 PWA 前端原型。要啟用真正 OCR 與 ChatGPT 解題，需部署安全後端並設定 API Key（不可把金鑰放在前端）。</p><label>後端 API 網址（選填）</label><input id="endpoint" placeholder="https://你的後端.example/api/solve"><div class="row"><button id="saveEndpoint">儲存 API 網址</button><button class="secondary" id="install" hidden>安裝 APP</button></div><p class="muted">未設定 API 時，示範題可展示固定解析；一般題目只顯示學習提示。</p><button class="secondary" onclick="window.open('https://script.google.com/a/macros/whjhs.tp.edu.tw/s/AKfycbxBgN07ya0Qr_o3OHkca_EYccFVzJTIH7m6q_l27PKjUfQ_0kdNfijAhTDnXcnJpGaI/exec','_blank')">開啟學校練習網站 ↗</button></div></section>
<div class="footer">Practice & learning · 請遵守課堂與測驗規範</div>
</main><script>
const $=id=>document.getElementById(id);let current=null, deferred=null;
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));['study','mistakes','settings'].forEach(p=>$(p).classList.toggle('hidden',p!==b.dataset.page))});
$('file').onchange=()=>{const f=$('file').files[0];if(f){$('preview').src=URL.createObjectURL(f);$('preview').style.display='block'}};
$('demo').onclick=()=>$('question').value='下列哪一項是植物進行光合作用的主要場所？\\n(A) 葉綠體 (B) 細胞膜 (C) 細胞核 (D) 液泡';
function solve(){let s=$('question').value.trim();if(!s){alert('請先貼上題目文字。');return}let a='目前尚未連接 AI 後端。請依課本概念判斷並逐一排除選項。',r='讀題抓關鍵詞 → 回想定義 → 比較各選項 → 檢查答案。',k='把題目對應到課本章節，整理核心概念。';if(s.includes('光合作用')||s.includes('葉綠體')){a='答案：(A) 葉綠體';r='光合作用主要在葉綠體中進行。葉綠體中的葉綠素吸收光能，協助植物合成養分。';k='葉綠體是植物細胞進行光合作用的重要構造；葉綠素負責吸收光能。'}current={q:s,a,r,k};$('answer').textContent=a;$('reason').textContent=r;$('knowledge').textContent=k;$('result').classList.remove('hidden')}
$('analyze').onclick=solve;$('save').onclick=()=>{if(!current)return;let arr=JSON.parse(localStorage.getItem('copilotMistakes')||'[]');arr.unshift(current);localStorage.setItem('copilotMistakes',JSON.stringify(arr));renderList();alert('已保存到錯題本')};
function renderList(){let arr=JSON.parse(localStorage.getItem('copilotMistakes')||'[]');$('list').innerHTML=arr.length?arr.map((x,i)=>`<div class="item"><b>${i+1}. ${escapeHtml(x.q)}</b><p>${escapeHtml(x.a)}</p></div>`).join(''):'<p class="muted">尚未保存題目。</p>'}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('clearMistakes').onclick=()=>{if(confirm('確定清空錯題本？')){localStorage.removeItem('copilotMistakes');renderList()}};renderList();
$('saveEndpoint').onclick=()=>{localStorage.setItem('copilotEndpoint',$('endpoint').value.trim());alert('已儲存網址（尚未驗證連線）')};$('endpoint').value=localStorage.getItem('copilotEndpoint')||'';
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;$('install').hidden=false});$('install').onclick=async()=>{if(deferred){deferred.prompt();await deferred.userChoice;deferred=null}};
</script></body></html>
